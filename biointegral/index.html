  if(mark){mark.textContent='';mark.style.background='transparent';mark.style.width='74px';mark.style.height='74px';mark.style.borderRadius='0';const img=d.createElement('img');img.src=LOGO;img.alt='Logo CENVIT';img.style.width='74px';img.style.height='74px';img.style.objectFit='contain';mark.appendChild(img)}
  const rh=d.querySelector('.resultHero');
  if(rh && !d.getElementById('printLogo')){const img=d.createElement('img');img.id='printLogo';img.src=LOGO;img.alt='Logo CENVIT';img.style.width='92px';img.style.height='92px';img.style.objectFit='contain';img.style.display='block';img.style.margin='0 0 12px 0';rh.insertBefore(img,rh.firstChild)}
  const st=d.createElement('style');st.textContent='@media print{#printLogo{display:block!important;width:82px!important;height:82px!important;margin-bottom:8px!important}}';d.head.appendChild(st);
  const resize=()=>{try{frame.style.height=Math.max(1200,d.documentElement.scrollHeight,d.body.scrollHeight)+20+'px'}catch(e){}};
  resize();
  if('ResizeObserver' in window){const ro=new ResizeObserver(resize);ro.observe(d.body)}else{setInterval(resize,800)}
});
})();
</script>
