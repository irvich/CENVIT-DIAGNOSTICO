<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b355f">
<title>Evaluación Biointegral Inicial | CENVIT</title>
<style>
:root{--navy:#0b355f;--gold:#d4aa3b;--muted:#66788a;--line:#d8e1e8;--bg:#f4f7fa}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
.top{height:7px;background:linear-gradient(90deg,var(--navy) 72%,var(--gold) 72%)}
header{background:#fff;border-bottom:1px solid var(--line)}
.brand{max-width:1000px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.brand img{width:84px;height:84px;object-fit:contain;display:block}
.brand strong{display:block;color:var(--navy);font-size:21px}
.brand small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}
#app{display:block;width:100%;border:0;min-height:1500px;background:var(--bg)}
@media(max-width:620px){.brand{padding:9px 12px}.brand img{width:66px;height:66px}.brand strong{font-size:17px}.brand small{font-size:11px}}
@media print{header,.top{display:none!important}#app{height:auto!important}}
</style>
</head>
<body>
<div class="top"></div>
<header>
  <div class="brand">
    <img src="../assets/logo-cenvit.png?v=20260930-2" alt="Logo oficial CENVIT">
    <div>
      <strong>CENVIT · Evaluación Biointegral</strong>
      <small>Valoración inicial de hábitos, salud, actividad física, disponibilidad y recursos</small>
    </div>
  </div>
</header>
<iframe id="app" src="app.html?v=20260930-2" title="Evaluación Biointegral CENVIT"></iframe>
<script>
(()=>{
 const frame=document.getElementById('app');
 function resize(){try{const d=frame.contentDocument;if(d)frame.style.height=Math.max(1500,d.documentElement.scrollHeight,d.body.scrollHeight)+30+'px'}catch(e){}}
 frame.addEventListener('load',()=>{resize();try{const d=frame.contentDocument;if('ResizeObserver' in window&&d&&d.body){new ResizeObserver(resize).observe(d.body)}}catch(e){}});
 setInterval(resize,1200);
})();
</script>
</body>
</html>
